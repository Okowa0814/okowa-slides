<body>
  <div id="__bundler_placeholder">Loading 用 Git 管理你的程式碼｜電資社進階班 第三堂...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Noto Serif TC';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/notoseriftc/v37/XLYgIZb5bJNDGYxLBibeHZ0BtnAOSA.woff2) format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --bg:#F6F5F2; --ink:#17171A; --mute:#6B6A66; --line:#DEDBD4;\n  --accent:oklch(0.5 0.1 255); --accent-l:oklch(0.75 0.09 255); --dark:#141518;\n  --serif:'Noto Sans TC',sans-serif; --sans:'Noto Sans TC',sans-serif; --mono:'JetBrains Mono','Noto Sans TC',monospace;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:#0E0F11;overflow:hidden;font-family:var(--sans);color:var(--ink)}\na{color:var(--accent)} a:hover{color:var(--ink)}\n#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}\n#deck{width:1920px;height:1080px;position:relative;flex:none;transform-origin:center center}\n.slide{position:absolute;inset:0;background:var(--bg);padding:110px 160px 140px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s ease}\n.slide.active{opacity:1;visibility:visible}\n.slide.dark{background:var(--dark);color:#F2F1EE}\n.meta{position:absolute;left:160px;width:1600px;bottom:64px;white-space:nowrap;display:flex;justify-content:space-between;font-size:22px;letter-spacing:.08em;color:var(--mute)}\n.dark .meta{color:#8E8D89}\n.kicker{font-family:var(--mono);font-size:24px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:28px}\n.dark .kicker{color:var(--accent-l)}\nh1,h2{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:.01em}\nh1{font-size:120px;line-height:1.18}\nh2{font-size:68px;line-height:1.25}\n.lead{font-size:38px;line-height:1.7;max-width:1450px;text-wrap:pretty}\n.mute{color:var(--mute)}\n.divider{justify-content:center}\n.divider .num{font-family:var(--serif);font-size:260px;line-height:1;color:var(--accent-l);margin-bottom:24px;font-weight:500}\n.divider h2{font-size:104px}\n.divider .lead{margin-top:40px;color:#B9B8B3}\n.tl{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:40px;margin:auto 0;height:440px}\n.tl::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--ink)}\n.tl div{position:relative;display:grid;grid-template-rows:1fr 32px 1fr;row-gap:32px}\n.tl div::before{content:'';grid-row:2;width:32px;height:32px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);box-sizing:border-box;position:relative;z-index:1}\n.tl div:first-child::before{background:var(--accent);border-color:var(--accent)}\n.tl.last div:first-child::before{background:var(--bg);border-color:var(--ink)}\n.tl.last div:last-child::before{background:var(--accent);border-color:var(--accent)}\n.tl div > *{grid-row:3;align-self:start}\n.tl div:nth-child(odd) > *{grid-row:1;align-self:end}\n.tl em{display:block;font-style:normal;font-family:var(--mono);font-size:24px;color:var(--accent);margin-bottom:16px}\n.tl p{margin:0;font-size:36px;line-height:1.5;font-weight:500;text-wrap:pretty}\n.tl small{display:block;font-size:24px;color:var(--mute);font-weight:400;margin-top:8px}\n.rows{display:flex;flex-direction:column;border-top:1px solid var(--ink);margin-top:44px;flex:1}\n.rows > div{flex:1;display:grid;grid-template-columns:96px 480px 1fr;align-items:center;border-bottom:1px solid var(--line);gap:0 24px}\n.rows i{font-style:normal;font-family:var(--mono);font-size:26px;color:var(--accent)}\n.rows b{font-size:38px}\n.rows p{margin:0;font-size:32px;line-height:1.5;color:var(--mute)}\n.k{font-family:var(--mono);font-size:.85em;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px 12px;color:var(--ink);white-space:nowrap}\n.code{font-family:var(--mono),var(--sans);background:#fff;border:1px solid var(--line);border-radius:6px;padding:40px 48px;font-size:28px;line-height:1.7;white-space:pre-wrap;color:#2A2A2E}\n.code b{color:var(--accent);font-weight:500}\n.code .c{color:#767570}\n.label{font-size:22px;letter-spacing:.12em;color:var(--mute);margin-bottom:20px}\n.note{display:flex;gap:28px;align-items:baseline;font-size:30px;line-height:1.6;padding-top:28px;border-top:1px solid var(--line)}\n.note strong{flex:none;white-space:nowrap;font-size:22px;letter-spacing:.12em;color:var(--accent);font-weight:500}\n.table{display:grid;border-top:1px solid var(--ink);margin-top:48px}\n.table .row{display:grid;border-bottom:1px solid var(--line);align-items:baseline}\n.table .row > div{padding:24px 24px 24px 0;font-size:31px;line-height:1.5}\n.table .head > div{font-size:22px;letter-spacing:.1em;color:var(--mute);padding:18px 0}\n.table .row > div:first-child{font-weight:700}\n.table.tight{margin-top:36px}\n.table.tight .row > div{padding:15px 24px 15px 0;font-size:27px}\n.table.tight .row > div:first-child{font-size:25px}\n.table.tight .head > div{font-size:20px;padding:12px 0}\n.quote{font-family:var(--serif);font-size:68px;line-height:1.55;font-weight:500;max-width:1500px;text-wrap:pretty}\n.quote em{font-style:normal;border-bottom:3px solid var(--accent-l)}\n.url{font-family:var(--mono);font-size:48px;color:var(--accent-l);margin-top:56px}\n.url span{color:#F2F1EE}\n/* 三個區域流程圖 */\n.zones{display:grid;grid-template-columns:3fr 1fr;gap:0 48px;margin-top:20px;font-size:22px;letter-spacing:.12em;color:var(--mute)}\n.zones div{border-bottom:2px dashed var(--line);padding-bottom:14px}\n.flow{display:grid;grid-template-columns:1fr 210px 1fr 210px 1fr 210px 1fr;align-items:center;margin-top:44px}\n.flow .box{border:2px solid var(--ink);border-radius:10px;background:#fff;padding:40px 28px;text-align:center;min-height:250px;display:flex;flex-direction:column;justify-content:center}\n.flow .box b{display:block;font-size:36px;margin-bottom:14px}\n.flow .box span{display:block;font-family:var(--mono);font-size:22px;color:var(--accent);margin-bottom:16px}\n.flow .box p{margin:0;font-size:26px;line-height:1.5;color:var(--mute)}\n.flow .box.cloud{background:var(--accent);border-color:var(--accent);color:#fff}\n.flow .box.cloud span,.flow .box.cloud p{color:#E6EAF5}\n.flow .arr{position:relative;text-align:center;padding:0 10px}\n.flow .arr code{display:inline-block;font-family:var(--mono);font-size:24px;color:var(--accent);margin-bottom:18px}\n.flow .arr::after{content:'';display:block;height:2px;background:var(--ink);margin:0 6px 0 0;position:relative}\n.flow .arr i{position:absolute;right:8px;bottom:-9px;width:0;height:0;border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}\n.vs{display:grid;grid-template-columns:1fr 1fr;gap:96px}\n.vs h2{font-size:80px}\n.cmd{display:grid;grid-template-columns:1fr 1fr;gap:64px;flex:1;min-height:0;margin-top:44px}\n#progress{position:fixed;left:0;top:0;height:3px;background:oklch(0.6 0.1 255);transition:width .4s ease;z-index:5}\n#nav{position:fixed;right:24px;top:50%;transform:translateY(-50%);flex-direction:column;display:flex;gap:8px;z-index:5;opacity:0;transition:opacity .2s}\n#nav:hover,#nav:focus-within{opacity:1}\n#nav button{width:44px;height:44px;border-radius:50%;border:1px solid #444;background:#1B1C1F;color:#ddd;font-size:18px;cursor:pointer}\n@media print{\n  html,body{overflow:visible;background:#fff}\n  #viewport{position:static;display:block}\n  #deck{transform:none!important;width:auto;height:auto}\n  .slide{position:relative;opacity:1;visibility:visible;width:1920px;height:1080px;page-break-after:always;transition:none}\n  #nav,#progress{display:none}\n  @page{size:1920px 1080px;margin:0}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"viewport\"><div id=\"deck\">\n\n<section class=\"slide dark\" data-label=\"封面\" style=\"justify-content:space-between\">\n  <div class=\"kicker\">電資社進階班｜第三堂課講義<\u002Fdiv>\n  <div>\n    <h1>用 Git 管理<br>你的程式碼<\u002Fh1>\n    <div style=\"width:160px;height:2px;background:var(--accent-l);margin:56px 0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"今天要完成什麼\">\n  <div class=\"kicker\">今日目標<\u002Fdiv>\n  <h2>今天要完成什麼？<\u002Fh2>\n  <p class=\"lead mute\" style=\"margin:28px 0 0\">完成這堂課後，你將能夠：<\u002Fp>\n  <div class=\"tl\">\n    <div><p><em>01<\u002Fem>說出為什麼需要 Git<\u002Fp><\u002Fdiv>\n    <div><p><em>02<\u002Fem>理解 Git 的運作原理<\u002Fp><\u002Fdiv>\n    <div><p><em>03<\u002Fem>安裝並設定 Git<\u002Fp><\u002Fdiv>\n    <div><p><em>04<\u002Fem>在電腦上登入 GitHub<\u002Fp><\u002Fdiv>\n    <div><p><em>05<\u002Fem>用 clone、commit、push 更新網站<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"你是不是也這樣存檔？\">\n  <div class=\"kicker\">為何需要 Git？<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 700px;gap:96px;flex:1;align-items:center\">\n    <div>\n      <h2>你是不是也這樣存檔？<\u002Fh2>\n      <p class=\"lead mute\" style=\"margin-top:40px\">檔案越存越多，卻還是不知道哪一份才是對的；改壞了想回到昨天，也找不到昨天的版本。<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <div class=\"label\">某位同學的桌面<\u002Fdiv>\n      <div class=\"code\" style=\"font-size:30px;line-height:1.9\">index.html\nindex_v2.html\nindex_v2_改好了.html\nindex_final.html\nindex_final_真的最終版.html\nindex_final_最終版(1).html  <span class=\"c\">← ？<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Git 能幫你做什麼\">\n  <div class=\"kicker\">為何需要 Git？<\u002Fdiv>\n  <h2>Git 能幫你做什麼<\u002Fh2>\n  <div class=\"rows\">\n    <div><i>01<\u002Fi><b>記錄每一次修改<\u002Fb><p>誰、在什麼時候、改了哪幾行，全部都有紀錄<\u002Fp><\u002Fdiv>\n    <div><i>02<\u002Fi><b>隨時回到過去<\u002Fb><p>改壞了也不怕，可以回到任何一個存檔點<\u002Fp><\u002Fdiv>\n    <div><i>03<\u002Fi><b>多人一起寫<\u002Fb><p>每個人改自己的部分，再合併在一起<\u002Fp><\u002Fdiv>\n    <div><i>04<\u002Fi><b>備份到雲端<\u002Fb><p>推到 GitHub 後，電腦壞掉程式碼也還在<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\" style=\"margin-top:36px\"><strong>業界標準<\u002Fstrong><span>幾乎所有軟體公司與開源專案都在用 Git，現在學會，以後一定用得到。<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide dark divider\" data-label=\"Git 的原理\">\n  <div class=\"num\">一<\u002Fdiv>\n  <h2>Git 的原理<\u002Fh2>\n  <p class=\"lead\">先搞懂 Git 怎麼想，指令就不需要死背。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Git 與 GitHub\" style=\"justify-content:center\">\n  <div class=\"kicker\">基本概念<\u002Fdiv>\n  <div class=\"vs\">\n    <div>\n      <h2>Git<\u002Fh2>\n      <p class=\"lead\" style=\"margin:36px 0 0\">安裝在<b>你電腦上<\u002Fb>的版本控制工具。沒有網路也能用，負責記錄每一次修改。<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h2>GitHub<\u002Fh2>\n      <p class=\"lead\" style=\"margin:36px 0 0\">放在<b>網路上<\u002Fb>的 Git 倉庫平台。讓你備份、分享程式碼，還能用 GitHub Pages 架網站。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\" style=\"margin-top:96px\"><strong>一句話記住<\u002Fstrong><span>Git 是工具，GitHub 是放 Git 專案的雲端空間。就像「相機」與「雲端相簿」的關係。<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"四個區域\">\n  <div class=\"kicker\">檔案的旅程<\u002Fdiv>\n  <h2>檔案會經過四個地方<\u002Fh2>\n  <div class=\"zones\"><div>你的電腦<\u002Fdiv><div>雲端<\u002Fdiv><\u002Fdiv>\n  <div class=\"flow\">\n    <div class=\"box\"><span>Working Directory<\u002Fspan><b>工作目錄<\u002Fb><p>你正在編輯的檔案<\u002Fp><\u002Fdiv>\n    <div class=\"arr\"><code>git add<\u002Fcode><i><\u002Fi><\u002Fdiv>\n    <div class=\"box\"><span>Staging Area<\u002Fspan><b>暫存區<\u002Fb><p>挑好要存進這次紀錄的檔案<\u002Fp><\u002Fdiv>\n    <div class=\"arr\"><code>git commit<\u002Fcode><i><\u002Fi><\u002Fdiv>\n    <div class=\"box\"><span>Local Repository<\u002Fspan><b>本地儲存庫<\u002Fb><p>存檔點，保存在電腦裡<\u002Fp><\u002Fdiv>\n    <div class=\"arr\"><code>git push<\u002Fcode><i><\u002Fi><\u002Fdiv>\n    <div class=\"box cloud\"><span>Remote<\u002Fspan><b>GitHub<\u002Fb><p>雲端上的同一份儲存庫<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"lead mute\" style=\"margin-top:auto;font-size:32px\">反方向：<span class=\"k\">git clone<\u002Fspan> 第一次把整個專案從 GitHub 下載下來，<span class=\"k\">git pull<\u002Fspan> 之後拿最新的修改。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Commit 是什麼\">\n  <div class=\"kicker\">Commit<\u002Fdiv>\n  <h2>Commit：遊戲裡的存檔點<\u002Fh2>\n  <p class=\"lead mute\" style=\"margin:28px 0 0\">每一次 commit 都是專案在那一刻的完整快照，附上一段說明與一組編號。<\u002Fp>\n  <div class=\"tl last\">\n    <div><p><em>a3f9c12<\u002Fem>建立首頁<small>週一 20:14<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>7b21e04<\u002Fem>加上自我介紹<small>週二 19:02<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>c88d5a1<\u002Fem>換成深色主題<small>週三 21:40<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>19fe3b7<\u002Fem>修正圖片路徑<small>週四 18:33<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>e5047dd<\u002Fem>新增作品集頁面<small>今天 · 最新<\u002Fsmall><\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\"><strong>重點<\u002Fstrong><span>Git 只把「有變化的部分」記下來，所以存再多版本也不會佔很多空間。<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide dark divider\" data-label=\"安裝與設定\">\n  <div class=\"num\">二<\u002Fdiv>\n  <h2>安裝與設定 Git<\u002Fh2>\n  <p class=\"lead\">每台電腦只需要做一次。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"安裝 Git\">\n  <div class=\"kicker\">Step 1 · Install<\u002Fdiv>\n  <h2>安裝 Git<\u002Fh2>\n  <div class=\"rows\">\n    <div><i>01<\u002Fi><b>Windows<\u002Fb><p>到 <span class=\"k\">git-scm.com<\u002Fspan> 下載安裝檔，選項全部用預設，一路按 <span class=\"k\">Next<\u002Fspan><\u002Fp><\u002Fdiv>\n    <div><i>02<\u002Fi><b>macOS<\u002Fb><p>打開「終端機」輸入 <span class=\"k\">git --version<\u002Fspan>，跳出視窗後按「安裝」<\u002Fp><\u002Fdiv>\n    <div><i>03<\u002Fi><b>打開終端機<\u002Fb><p>Windows 用 <span class=\"k\">Git Bash<\u002Fspan>，Mac 用「終端機（Terminal）」<\u002Fp><\u002Fdiv>\n    <div><i>04<\u002Fi><b>確認安裝成功<\u002Fb><p>輸入 <span class=\"k\">git --version<\u002Fspan>，看到版本號就代表成功<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"告訴 Git 你是誰\">\n  <div class=\"kicker\">Step 2 · Config<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:96px;flex:1;align-items:center\">\n    <div>\n      <h2>告訴 Git 你是誰<\u002Fh2>\n      <p class=\"lead mute\" style=\"margin-top:40px\">每個 commit 都會記下作者。第一次使用時，要先設定名字與 Email。<\u002Fp>\n      <div class=\"note\" style=\"margin-top:56px\"><strong>Email 要一樣<\u002Fstrong><span>填註冊 GitHub 時用的 Email，GitHub 才認得是你的 commit。<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"code\"><span class=\"c\"># 設定名字（用英文）<\u002Fspan>\n<b>git config<\u002Fb> --global user.name \"Okowa\"\n\n<span class=\"c\"># 設定 Email<\u002Fspan>\n<b>git config<\u002Fb> --global user.email \"you@example.com\"\n\n<span class=\"c\"># 檢查是否設定成功<\u002Fspan>\n<b>git config<\u002Fb> --list<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide dark divider\" data-label=\"登入 GitHub\">\n  <div class=\"num\">三<\u002Fdiv>\n  <h2>在電腦上登入 GitHub<\u002Fh2>\n  <p class=\"lead\">讓 Git 有權限把檔案推到你的 repo。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"登入方式\">\n  <div class=\"kicker\">Step 3 · Sign in<\u002Fdiv>\n  <h2>兩種登入方式，選一種就好<\u002Fh2>\n  <div class=\"table\">\n    <div class=\"row head\" style=\"grid-template-columns:460px 1fr 1fr\"><div>方式<\u002Fdiv><div>怎麼做<\u002Fdiv><div>適合<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:460px 1fr 1fr\"><div>A · 瀏覽器自動登入<\u002Fdiv><div class=\"mute\">第一次 <span class=\"k\">git push<\u002Fspan> 時，會自動跳出 GitHub 登入視窗，按授權即可<\u002Fdiv><div class=\"mute\">Windows（安裝 Git 時已內建）<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:460px 1fr 1fr\"><div>B · GitHub CLI<\u002Fdiv><div class=\"mute\">安裝 <span class=\"k\">gh<\u002Fspan> 後輸入 <span class=\"k\">gh auth login<\u002Fspan>，用瀏覽器完成登入<\u002Fdiv><div class=\"mute\">Mac，或方式 A 沒有跳出視窗時<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\" style=\"margin-top:auto\"><strong>不能用密碼<\u002Fstrong><span>GitHub 已不接受在終端機輸入帳號密碼。如果它要你打密碼，請改用上面兩種方式。<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"用 GitHub CLI 登入\">\n  <div class=\"kicker\">方式 B · gh auth login<\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 760px;gap:96px;flex:1;min-height:0\">\n    <div style=\"display:flex;flex-direction:column\">\n      <h2>用 GitHub CLI 登入<\u002Fh2>\n      <div class=\"rows\">\n        <div style=\"grid-template-columns:80px 1fr\"><i>01<\u002Fi><p style=\"color:var(--ink)\">到 <span class=\"k\">cli.github.com<\u002Fspan> 下載安裝（Mac 可用 <span class=\"k\">brew install gh<\u002Fspan>）<\u002Fp><\u002Fdiv>\n        <div style=\"grid-template-columns:80px 1fr\"><i>02<\u002Fi><p style=\"color:var(--ink)\">輸入 <span class=\"k\">gh auth login<\u002Fspan>，依右邊選項選擇<\u002Fp><\u002Fdiv>\n        <div style=\"grid-template-columns:80px 1fr\"><i>03<\u002Fi><p style=\"color:var(--ink)\">複製畫面上的一次性代碼，在瀏覽器貼上並授權<\u002Fp><\u002Fdiv>\n        <div style=\"grid-template-columns:80px 1fr\"><i>04<\u002Fi><p style=\"color:var(--ink)\">輸入 <span class=\"k\">gh auth status<\u002Fspan>，看到帳號就成功了<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center\">\n      <div class=\"label\">終端機畫面<\u002Fdiv>\n      <div class=\"code\" style=\"font-size:26px\">$ <b>gh auth login<\u002Fb>\n? Where do you use GitHub?\n  <b>› GitHub.com<\u002Fb>\n? Preferred protocol?\n  <b>› HTTPS<\u002Fb>\n? Authenticate Git with your\n  GitHub credentials? <b>Yes<\u002Fb>\n? How would you like to log in?\n  <b>› Login with a web browser<\u002Fb>\n\n! First copy your one-time code:\n  <b>A1B2-C3D4<\u002Fb><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide dark divider\" data-label=\"基本指令操作\">\n  <div class=\"num\">四<\u002Fdiv>\n  <h2>基本指令操作<\u002Fh2>\n  <p class=\"lead\">clone 一次，之後每次修改都是 add → commit → push。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"常用指令一覽\">\n  <div class=\"kicker\">Cheat sheet<\u002Fdiv>\n  <h2>常用指令一覽<\u002Fh2>\n  <div class=\"table tight\">\n    <div class=\"row head\" style=\"grid-template-columns:520px 1fr\"><div>指令<\u002Fdiv><div>做什麼<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git clone &lt;網址&gt;<\u002Fdiv><div class=\"mute\">把 GitHub 上的 repo 下載到電腦<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git status<\u002Fdiv><div class=\"mute\">看哪些檔案改了、哪些還沒存<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git add .<\u002Fdiv><div class=\"mute\">把所有修改放進暫存區<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git commit -m \"說明\"<\u002Fdiv><div class=\"mute\">建立一個存檔點，並寫下這次改了什麼<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git push<\u002Fdiv><div class=\"mute\">把存檔點推上 GitHub<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git pull<\u002Fdiv><div class=\"mute\">把 GitHub 上最新的修改拉下來<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:520px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git log --oneline<\u002Fdiv><div class=\"mute\">列出所有存檔紀錄<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Clone\">\n  <div class=\"kicker\">Step 4 · Clone<\u002Fdiv>\n  <h2>把上一堂的網站下載到電腦<\u002Fh2>\n  <div class=\"cmd\">\n    <div class=\"rows\" style=\"margin-top:0\">\n      <div style=\"grid-template-columns:80px 1fr\"><i>01<\u002Fi><p style=\"color:var(--ink)\">打開你的 repo 頁面，點綠色的 <span class=\"k\">Code<\u002Fspan> 按鈕<\u002Fp><\u002Fdiv>\n      <div style=\"grid-template-columns:80px 1fr\"><i>02<\u002Fi><p style=\"color:var(--ink)\">選 <span class=\"k\">HTTPS<\u002Fspan>，複製網址<\u002Fp><\u002Fdiv>\n      <div style=\"grid-template-columns:80px 1fr\"><i>03<\u002Fi><p style=\"color:var(--ink)\">在終端機輸入 <span class=\"k\">git clone<\u002Fspan> 加上網址<\u002Fp><\u002Fdiv>\n      <div style=\"grid-template-columns:80px 1fr\"><i>04<\u002Fi><p style=\"color:var(--ink)\">用 <span class=\"k\">cd<\u002Fspan> 進入資料夾，就可以開始修改<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center\">\n      <div class=\"code\"><span class=\"c\"># 下載 repo<\u002Fspan>\n$ <b>git clone<\u002Fb> https://github.com/\n  username/my-website.git\n\n<span class=\"c\"># 進入資料夾<\u002Fspan>\n$ <b>cd<\u002Fb> my-website\n\n<span class=\"c\"># 用 VS Code 打開（選用）<\u002Fspan>\n$ <b>code<\u002Fb> .<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Add 與 Commit\">\n  <div class=\"kicker\">Step 5 · Add &amp; Commit<\u002Fdiv>\n  <h2>改好之後，建立存檔點<\u002Fh2>\n  <div class=\"cmd\">\n    <div class=\"code\" style=\"align-self:center\"><span class=\"c\"># 1. 看看改了哪些檔案<\u002Fspan>\n$ <b>git status<\u002Fb>\n  modified:   index.html\n\n<span class=\"c\"># 2. 放進暫存區<\u002Fspan>\n$ <b>git add<\u002Fb> .\n\n<span class=\"c\"># 3. 建立 commit<\u002Fspan>\n$ <b>git commit<\u002Fb> -m \"更新自我介紹\"<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center\">\n      <div class=\"label\">好的 commit 訊息<\u002Fdiv>\n      <div class=\"table\" style=\"margin-top:0\">\n        <div class=\"row\" style=\"grid-template-columns:90px 1fr\"><div style=\"color:var(--accent)\">好<\u002Fdiv><div>加上作品集頁面<\u002Fdiv><\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns:90px 1fr\"><div style=\"color:var(--accent)\">好<\u002Fdiv><div>修正手機版選單跑版<\u002Fdiv><\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns:90px 1fr\"><div class=\"mute\">差<\u002Fdiv><div class=\"mute\">update<\u002Fdiv><\u002Fdiv>\n        <div class=\"row\" style=\"grid-template-columns:90px 1fr\"><div class=\"mute\">差<\u002Fdiv><div class=\"mute\">asdfgh<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"lead mute\" style=\"font-size:30px;margin-top:32px\">一個月後的你，會感謝現在寫清楚的自己。<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"Push\">\n  <div class=\"kicker\">Step 6 · Push<\u002Fdiv>\n  <h2>推上 GitHub，網站自動更新<\u002Fh2>\n  <div class=\"cmd\">\n    <div class=\"code\" style=\"align-self:center\">$ <b>git push<\u002Fb>\nEnumerating objects: 5, done.\nWriting objects: 100% (3/3)\nTo https://github.com/username/\n   my-website.git\n   19fe3b7..e5047dd  main -&gt; main<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;justify-content:center;gap:48px\">\n      <div style=\"border-top:1px solid var(--ink);padding-top:28px\"><div class=\"label\" style=\"color:var(--accent)\">第一次 push<\u002Fdiv><p class=\"lead\" style=\"margin:0;font-size:32px\">如果跳出登入視窗，登入 GitHub 並按授權即可。<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--ink);padding-top:28px\"><div class=\"label\" style=\"color:var(--accent)\">看到 main -&gt; main<\u002Fdiv><p class=\"lead\" style=\"margin:0;font-size:32px\">代表成功了，回 GitHub 重新整理就能看到新的 commit。<\u002Fp><\u002Fdiv>\n      <div style=\"border-top:1px solid var(--ink);padding-top:28px\"><div class=\"label\" style=\"color:var(--accent)\">GitHub Pages<\u002Fdiv><p class=\"lead\" style=\"margin:0;font-size:32px\">上一堂設定好的網站會自動重新部署，不用再上傳檔案。<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"完整流程\">\n  <div class=\"kicker\">完整流程<\u002Fdiv>\n  <h2>以後更新網站，只要這樣做<\u002Fh2>\n  <div class=\"tl last\">\n    <div><p><em>只做一次<\u002Fem>git clone<small>下載 repo<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>每次<\u002Fem>修改檔案<small>寫程式、存檔<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>每次<\u002Fem>git add .<small>放進暫存區<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>每次<\u002Fem>git commit -m<small>建立存檔點<\u002Fsmall><\u002Fp><\u002Fdiv>\n    <div><p><em>每次<\u002Fem>git push<small>推上 GitHub<\u002Fsmall><\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"note\"><strong>換電腦時<\u002Fstrong><span>在新電腦上先 <span class=\"k\">git pull<\u002Fspan>（或重新 clone），拿到最新版本再開始改。<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide dark divider\" data-label=\"常見問題\">\n  <div class=\"num\">五<\u002Fdiv>\n  <h2>常見問題<\u002Fh2>\n  <p class=\"lead\">看到紅字先別慌，大部分錯誤訊息都會告訴你怎麼修。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"問題排查\">\n  <div class=\"kicker\">Troubleshooting<\u002Fdiv>\n  <h2>問題排查<\u002Fh2>\n  <div class=\"table tight\">\n    <div class=\"row head\" style=\"grid-template-columns:720px 1fr\"><div>錯誤訊息<\u002Fdiv><div>原因與解法<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">git: command not found<\u002Fdiv><div class=\"mute\">還沒安裝 Git，或安裝後沒重開終端機<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">Author identity unknown<\u002Fdiv><div class=\"mute\">還沒設定 <span class=\"k\">user.name<\u002Fspan> 和 <span class=\"k\">user.email<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">Authentication failed<\u002Fdiv><div class=\"mute\">登入失敗，改用瀏覽器登入或 <span class=\"k\">gh auth login<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">rejected … (fetch first)<\u002Fdiv><div class=\"mute\">GitHub 上有你電腦沒有的修改，先 <span class=\"k\">git pull<\u002Fspan> 再 push<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">nothing to commit<\u002Fdiv><div class=\"mute\">沒有任何修改，或忘了存檔<\u002Fdiv><\u002Fdiv>\n    <div class=\"row\" style=\"grid-template-columns:720px 1fr\"><div style=\"font-family:var(--mono);font-weight:500\">not a git repository<\u002Fdiv><div class=\"mute\">不在專案資料夾裡，先用 <span class=\"k\">cd<\u002Fspan> 進入<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"slide\" data-label=\"安全提醒\" style=\"justify-content:center\">\n  <div class=\"kicker\">安全提醒<\u002Fdiv>\n  <p class=\"quote\" style=\"margin:0\">Git 會記住<em>每一個版本<\u002Fem>，包括你後來刪掉的檔案。<\u002Fp>\n  <p class=\"lead mute\" style=\"margin-top:56px\">密碼或 API 金鑰一旦 push 上去，就算之後刪除，歷史紀錄裡還是查得到。commit 之前，先用 <span class=\"k\">git status<\u002Fspan> 看清楚要上傳什麼。<\u002Fp>\n<\u002Fsection>\n\n<section class=\"slide dark\" data-label=\"今天的目標\" style=\"justify-content:center\">\n  <div class=\"kicker\">今天的目標<\u002Fdiv>\n  <p class=\"quote\" style=\"margin:0\">每一次 commit，都是一個<em>可以回去的存檔點<\u002Fem>。<\u002Fp>\n  <div class=\"url\">git add . <span>→<\u002Fspan> git commit -m \"…\" <span>→<\u002Fspan> git push<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv><\u002Fdiv>\n<div id=\"nav\"><button id=\"prev\" aria-label=\"上一頁\">‹<\u002Fbutton><button id=\"next\" aria-label=\"下一頁\">›<\u002Fbutton><\u002Fdiv>\n\n<script>\n(function(){\n  const deck=document.getElementById('deck');\n  const slides=[...deck.querySelectorAll('.slide')];\n  const total=slides.length;\n  slides.forEach((s,i)=>{\n    const m=document.createElement('div');m.className='meta';\n    m.innerHTML='<span>電資社進階班｜Git 版本控制<\u002Fspan><span>'+String(i+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')+'<\u002Fspan>';\n    s.appendChild(m);\n  });\n  let cur=Math.min(Math.max(parseInt(location.hash.slice(1))-1||0,0),total-1);\n  function show(n){\n    cur=Math.min(Math.max(n,0),total-1);\n    slides.forEach((s,i)=>s.classList.toggle('active',i===cur));\n    history.replaceState(null,'','#'+(cur+1));\n  }\n  function fit(){deck.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}\n  addEventListener('resize',fit);\n  addEventListener('keydown',e=>{\n    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(cur+1)}\n    if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(cur-1)}\n    if(e.key==='Home')show(0);\n    if(e.key==='End')show(total-1);\n    if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}\n  });\n  document.getElementById('prev').onclick=()=>show(cur-1);\n  document.getElementById('next').onclick=()=>show(cur+1);\n  let tx=null;\n  addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});\n  addEventListener('touchend',e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cur+(d<0?1:-1));tx=null});\n  fit();show(cur);\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
